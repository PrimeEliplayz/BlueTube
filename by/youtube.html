<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Youtube/clone</title>

    <style>
        .search-bar {
            display: block;
        }

        .thumbnail {
            width: 300px;
            display: block;
        }

        .video-preview {
            width: 300px;
            display: inline-block;
            vertical-align: top;
            margin-right: 15px;
            margin-bottom: 15px;
        }

        .channel-pfp {
            display: inline-block;
            width: 50px;
            vertical-align: top;
        }

        .profile-pic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .video-info {
            display: inline-block;
            width: 240px;
            vertical-align: top;
        }

        .video-title {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .video-author {
            margin-top: 0;
            margin-bottom: 5px;
        }

        .video-stats {
            margin-top: 0;
        }
    </style>
</head>

<body>

    <input class="search-bar" type="text" placeholder="Search">

    <div class="video-preview">
        <img class="thumbnail" src="thumbnails/thumbnail.avif">

        <div class="channel-pfp">
            <img class="profile-pic" src="channel-pfp's/prismpfp.jpg">
        </div>

        <div class="video-info">
            <p class="video-title">
                Minecraft Features Nobody Uses
            </p>

            <p class="video-author">
                PrismBlock
            </p>

            <p class="video-stats">
                1.5M views • 4 weeks ago
            </p>
        </div>
    </div>

    <div class="video-preview">
        <img class="thumbnail" src="thumbnails/caldruki.avif">

        <div class="channel-pfp">
            <img class="profile-pic" src="channel-pfp's/caldruki.jpg">
        </div>

        <div class="video-info">
            <p class="video-title">
                Stupidest Kid Comments
            </p>

            <p class="video-author">
                Caldruki
            </p>

            <p class="video-stats">
                1.3M views • 8 months ago
            </p>
        </div>
    </div>

    <p class="version">Version 1.0</p>

</body>
</html>
