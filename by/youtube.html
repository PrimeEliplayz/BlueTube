<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Youtube/clone</title>

    <style>
        .search-bar {
            display: block;
        }

        .thumbnail {
            width: 300px;
            display: block;
        }

        .video-title {
            width: 300px;
        }

        .video-preview {
            width: 300px;
            display: inline-block;
            vertical-align: top;
            margin-right: 15px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <input class="search-bar" type="text" placeholder="Search">

    <div class="video-preview">
        <img class="thumbnail" src="thumbnails/thumbnail.avif">

        <p class="video-title">
            <strong>Minecraft Features</strong> Nobody Uses
        </p>

        <p class="video-author">
            <strong>PrismBlock</strong>
        </p>

        <p class="video-stats">
            <strong>1.5M views • 4 weeks ago</strong>
        </p>
    </div>

    <div class="video-preview">
        <img class="thumbnail" src="thumbnails/caldruki.avif">

        <p class="video-title">
            <strong>Stupidest</strong> Kid Comments
        </p>

        <p class="video-author">
            <strong>Caldruki</strong>
        </p>

        <p class="video-stats">
            <strong>1.3M views • 8 months ago</strong>
        </p>
    </div>

    <p class="version">Version 1.0</p>
</body>
</html>
