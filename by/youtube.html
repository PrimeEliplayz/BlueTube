<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Youtube/clone</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

    <style>
        p {
            font-family: Fredoka, Arial, Roboto;
            margin-top: 0;
            margin-bottom: 0;
        }

        .search-bar {
            display: block;
        }

        .thumbnail {
            width: 300px;
            display: block;
        }

        .video-preview {
            width: 300px;
            display: inline-block;
            vertical-align: top;
            margin-right: 15px;
            margin-bottom: 15px;
        }

        .channel-pfp {
            display: inline-block;
            width: 50px;
            vertical-align: top;
        }

        .profile-pic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .video-info {
            display: inline-block;
            width: 240px;
            vertical-align: top;
        }

        .video-title {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            margin-bottom: 12px;

            background: linear-gradient(
                90deg,
                red,
                orange,
                yellow,
                green,
                cyan,
                blue,
                violet,
                red
            );

            background-size: 400% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            animation: rainbow 8s linear infinite;
        }

        @keyframes rainbow {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 400% 50%;
            }
        }

        .video-author {
            margin-top: 5px;
            margin-bottom: 5px;
            font-size: 12px;
            color: rgb(96, 96, 96);
        }

        .video-stats {
            margin-top: 0;
            font-size: 12px;
            color: rgb(96, 96, 96);
        }

        .video-author {
            margin-bottom: 4px;
        }

        .thumbnail-row {
            margin-bottom: 10px;
        }

        .version {
            position: fixed;
            bottom: 10px;
            left: 10px;
        }
    </style>
</head>

<body>

    <input class="search-bar" type="text" placeholder="Search">

    <div class="video-preview">
        <div class="thumbnail-row">
            <img class="thumbnail" src="thumbnails/thumbnail.avif">
        </div>

        <div class="channel-pfp">
            <img class="profile-pic" src="channel-pfp's/prismpfp.jpg">
        </div>

        <div class="video-info">
            <p class="video-title">
                Minecraft Features Nobody Uses
            </p>

            <p class="video-author">
                PrismBlock
            </p>

            <p class="video-stats">
                1.5M views • 4 weeks ago
            </p>
        </div>
    </div>

    <div class="video-preview">
        <div class="thumbnail-row">
            <img class="thumbnail" src="thumbnails/caldruki.avif">
        </div>

        <div class="channel-pfp">
            <img class="profile-pic" src="channel-pfp's/caldruki.jpg">
        </div>

        <div class="video-info">
            <p class="video-title">
                Stupidest Kid Comments
            </p>

            <p class="video-author">
                Caldruki
            </p>

            <p class="video-stats">
                1.3M views • 8 months ago
            </p>
        </div>
    </div>
    
    <p class="version">Version 1.2</p>

</body>
</html>
